<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="28" fill="#1B3B2B"/>
  <!-- Isometric stacked floor slabs with parcel anchor pin -->
  <polygon points="60,24 94,40 60,56 26,40" fill="#D8E97C" opacity="0.95"/>
  <polygon points="26,40 60,56 60,63 26,47" fill="#B5CC58"/>
  <polygon points="94,40 60,56 60,63 94,47" fill="#A2BA47"/>
  
  <polygon points="60,46 94,62 60,78 26,62" fill="#B2D1E0" opacity="0.9"/>
  <polygon points="26,62 60,78 60,85 26,69" fill="#8BB5CA"/>
  <polygon points="94,62 60,78 60,85 94,69" fill="#75A1B8"/>

  <polygon points="60,68 94,84 60,100 26,84" fill="#F5F1E8" opacity="0.9"/>
  <polygon points="26,84 60,100 60,105 26,89" fill="#DDD5C7"/>
  <polygon points="94,84 60,100 60,105 94,89" fill="#C9BFAD"/>
  
  <!-- Subtle coordinate dashed projection axis -->
  <line x1="60" y1="20" x2="60" y2="104" stroke="#1B3B2B" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6"/>
  <circle cx="60" cy="24" r="3" fill="#1B3B2B"/>
</svg>